<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes">
<title>Creator Shortlist — SoshMan</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root {
  --cream: #ffffff;
  --ink: #0f0e17;
  --blue: #2563eb;
  --blue2: #1d4ed8;
  --purple: #7c3aed;
  --green: #059669;
  --amber: #d97706;
  --red: #dc2626;
  --pink: #db2777;
  --card-bg: #ffffff;
  --border: #e8e3db;
  --muted: #9a9589;
  --radius: 20px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background: #f8f9ff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background-image: 
    radial-gradient(ellipse at 20% 0%, rgba(124,58,237,0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 0%, rgba(37,99,235,0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(5,150,105,0.04) 0%, transparent 50%);
}
/* A4 page container */
#pdf-area{
  max-width: 794px;
  margin: 0 auto;
  background: #ffffff;
  min-height: 100vh;
  box-shadow: 0 0 40px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
}
/* Soshman branding footer on each card */
.soshman-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;
  border-top:1px solid #f0ece6;
  background:#fafaf8;
  font-size:10px;color:#aaa;
}
.soshman-footer a{color:#aaa;text-decoration:none;}

/* ── ANIMATIONS ── */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes savedFlash{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

.fade-in{animation:fadeSlideUp .4s ease both;}
.pop-in{animation:popIn .3s ease both;}

/* ── TOOLBAR ── */
.toolbar{
  position:sticky;top:0;z-index:300;
  background:rgba(255,255,255,0.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,0.07);
  padding:0 24px;
  height:52px;
  display:flex;align-items:center;
  gap:10px;
}
.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow:hidden;}
.toolbar-logo{height:32px;width:auto;flex-shrink:0;}
.toolbar-div{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.brand-input{
  font-size:14px;font-weight:700;font-family:inherit;
  border:none;background:transparent;color:var(--ink);
  outline:none;width:140px;
  border-bottom:2px solid transparent;
  transition:border-color .2s;padding-bottom:2px;
}
.brand-input:focus{border-bottom-color:var(--blue);}
.obj-text{font-size:11px;color:var(--muted);cursor:pointer;border-bottom:1px dashed var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
.obj-input{font-size:11px;color:#444;border:1px solid var(--blue);border-radius:6px;padding:3px 8px;outline:none;font-family:inherit;width:260px;background:#fff;}
.toolbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.saved-badge{
  font-size:11px;font-weight:600;color:var(--green);
  display:flex;align-items:center;gap:4px;
  opacity:0;transition:opacity .3s;
}
.saved-badge.show{animation:savedFlash 2s ease forwards;}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;font-weight:700;font-size:12px;
  border:none;border-radius:10px;cursor:pointer;
  padding:8px 16px;white-space:nowrap;
  transition:all .18s;
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-blue{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3);}
.btn-blue:hover{box-shadow:0 6px 20px rgba(37,99,235,.4);}
.btn-dark{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.btn-dark:hover{box-shadow:0 6px 20px rgba(0,0,0,.3);}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.3);}
.btn-ghost{background:rgba(0,0,0,0.05);color:var(--ink);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(0,0,0,0.09);}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:8px;}
.btn-icon{padding:7px;border-radius:9px;}

/* ── HERO ── */
.page-hero{
  padding:24px 28px 20px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  flex-wrap:wrap;
  background:linear-gradient(135deg,#fff 0%,#f0f4ff 100%);
  border-bottom:1px solid #e8e3db;
}
.hero-left{flex:1;min-width:240px;}
.hero-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.hero-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1.2;color:var(--ink);}
.hero-title .brand{color:var(--blue2);}
.hero-title .x{color:#bbb;font-weight:300;margin:0 8px;font-size:0.8em;}
.hero-title .sm{
  color:#0f0e17;
  -webkit-text-fill-color:#0f0e17;
}
.hero-sub{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6;}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.prep-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;}
.prep-logo{height:36px;width:auto;}

/* ── DECK STATS ── */
.deck-stats{
  display:flex;gap:10px;padding:0 28px 16px;flex-wrap:wrap;
}
.stat-pill{
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:10px 18px;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  transition:all .2s;
  min-width:110px;
}
.stat-pill:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(37,99,235,.15);}
.stat-val{font-size:18px;font-weight:800;color:var(--ink);}
.stat-val.green{color:var(--green);}
.stat-val.blue{color:var(--blue);}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}

/* ── DECK TOOLBAR ── */
.deck-toolbar{
  display:flex;align-items:center;gap:10px;padding:0 20px 14px;flex-wrap:wrap;
}
.deck-select{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:7px 12px;font-family:inherit;font-size:12px;font-weight:600;
  color:var(--ink);cursor:pointer;outline:none;
}
.search-box{
  display:flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:7px 12px;flex:1;max-width:240px;
}
.search-box input{border:none;outline:none;font-family:inherit;font-size:12px;color:var(--ink);background:transparent;width:100%;}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);
  transition:all .15s;
}
.chip.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.3);}

/* ── SUMMARY TABLE ── */
.summary-wrap{margin:0 20px 16px;}
.summary-card{
  background:#fff;border-radius:var(--radius);border:1px solid var(--border);
  overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.06);
}
.summary-head{padding:16px 20px;border-bottom:1px solid #f0ece6;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#f8f9ff,#fff);}
.summary-head h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.summary-table{width:100%;border-collapse:collapse;}
.summary-table th{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);padding:10px 14px;text-align:left;
  background:#fafaf8;border-bottom:1px solid #f0ece6;
}
.summary-table td{padding:12px 14px;border-bottom:1px solid #f9f7f4;font-size:13px;vertical-align:middle;}
.summary-table tr:last-child td{border-bottom:none;}
.summary-table tr:hover td{background:#fafaf8;}
.fit-bar-wrap{display:flex;align-items:center;gap:8px;min-width:100px;}
.fit-bar-bg{flex:1;height:5px;background:#ede9e2;border-radius:3px;overflow:hidden;}
.fit-bar-fill{height:100%;border-radius:3px;transition:width .5s ease;}

/* ── CREATOR CARDS ── */
.cards-wrap{padding:0 20px;display:flex;flex-direction:column;gap:16px;}
.creator-card{
  background:#fff;border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:0 4px 24px rgba(0,0,0,.06);
  overflow:hidden;
  transition:box-shadow .2s;
}
.creator-card:hover{box-shadow:0 8px 40px rgba(0,0,0,.1);}
.card-accent{height:3px;background:linear-gradient(90deg,#2563eb,#7c3aed,#059669);}

/* ── OVERFLOW MENU ── */
.overflow-menu-wrapper{position:relative;display:inline-flex;}
.overflow-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:10px;
  background:rgba(0,0,0,0.05);border:1px solid var(--border);
  font-size:18px;cursor:pointer;color:var(--ink);
  font-family:inherit;font-weight:700;
  transition:all .15s;
  letter-spacing:0;line-height:1;
}
.overflow-btn:hover{background:rgba(0,0,0,0.09);}
.overflow-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;
  background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.14);
  min-width:190px;z-index:400;
  overflow:hidden;
  animation:popIn .18s ease;
}
.overflow-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;font-size:12px;font-weight:600;
  cursor:pointer;color:var(--ink);font-family:inherit;
  background:none;border:none;width:100%;text-align:left;
  transition:background .12s;
}
.overflow-item:hover{background:#f5f1ea;}
.overflow-item-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.overflow-divider{height:1px;background:#f0ece6;margin:2px 0;}
.overflow-sub{display:none;}/* not used - inline view now */
.overflow-sub-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;font-size:12px;font-weight:600;
  cursor:pointer;color:var(--ink);font-family:inherit;
  background:none;border:none;width:100%;text-align:left;
  transition:background .12s;
}
.overflow-sub-item:hover{background:#f5f1ea;}
.overflow-sub-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#aaa;padding:8px 16px 2px;font-weight:700;display:block;}

/* card header */
.card-header{padding:16px 20px 14px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #f0ece6;background:linear-gradient(135deg,#ffffff 0%,#f0f4ff 100%);}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.avatar-placeholder{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:#fff;
  box-shadow:0 4px 16px rgba(37,99,235,.3);
  border:3px solid #fff;
}
.ig-badge{
  position:absolute;bottom:-3px;right:-3px;
  width:22px;height:22px;border-radius:7px;
  background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.card-meta{flex:1;min-width:0;}
.creator-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:#111;line-height:1.2;margin-bottom:3px;}
.creator-handle{font-size:13px;color:var(--blue);font-weight:500;text-decoration:none;}
.creator-handle:hover{text-decoration:underline;}
.creator-loc{font-size:12px;color:var(--muted);}
.creator-follow{font-size:12px;color:#666;margin:6px 0 10px;font-family:'JetBrains Mono',monospace;}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;}
.tag-0{background:#dbeafe;color:#1d4ed8;}
.tag-1{background:#ede9fc;color:#6d28d9;}
.tag-2{background:#dcfce7;color:#15803d;}
.tag-3{background:#fef9c3;color:#854d0e;}
.tag-4{background:#ffe4e6;color:#9f1239;}
.tag-fit{background:#dcfce7;color:#15803d;font-weight:700;}
.card-right{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.campaign-info{text-align:right;}
.camp-period-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.camp-period{font-size:13px;font-weight:700;color:#333;}
.camp-days{font-size:10px;color:var(--muted);}
.card-actions{display:flex;gap:6px;no-print:true;}

/* fit score ring */
.fit-ring{position:relative;width:64px;height:64px;flex-shrink:0;}
.fit-ring svg{width:64px;height:64px;transform:rotate(-90deg);}
.fit-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink);}

/* KPIs */
.kpi-section{padding:14px 20px;}
.kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.kpi-cell{
  background:linear-gradient(135deg,#f9f7f3,#f4f0e8);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 8px;text-align:center;
  transition:all .2s;
}
.kpi-cell:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(37,99,235,.12);background:linear-gradient(135deg,#f0f4ff,#f5f0ff);border-color:#c7d2fe;}
.kpi-cell-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.kpi-cell-val{font-size:16px;font-weight:800;color:var(--ink);}
.kpi-cell-val.accent{
  color:#059669;
}

/* audience + content */
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px;}
.info-box{background:#f9f7f3;border:1px solid var(--border);border-radius:10px;padding:12px;transition:all .2s;}
.info-box-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-label{font-size:11px;color:#666;width:72px;flex-shrink:0;}
.bar-bg{flex:1;height:5px;background:#ede9e2;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-pct{font-size:11px;font-weight:700;color:var(--ink);width:38px;text-align:right;flex-shrink:0;}
.city-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0ece6;}
.city-row:last-child{border-bottom:none;}
.city-name{font-size:12px;color:#555;}
.city-pct{font-size:12px;font-weight:700;color:var(--ink);}

/* past brands */
.brand-chips{display:flex;gap:6px;flex-wrap:wrap;}
.brand-chip{
  display:flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--border);border-radius:6px;
  padding:3px 8px;font-size:10px;
}
.brand-chip-name{font-weight:700;color:var(--ink);}
.brand-chip-cat{color:var(--muted);}

/* reels */
.reels-section{padding:0 20px 14px;}
.reels-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px;}
.reels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.reel-card{
  border-radius:14px;overflow:hidden;
  aspect-ratio:9/16;
  position:relative;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  cursor:pointer;
  transition:all .2s;
  box-shadow:0 4px 16px rgba(0,0,0,.15);
}
.reel-card:hover{transform:scale(1.04);box-shadow:0 8px 28px rgba(0,0,0,.25);}
.reel-thumb{width:100%;height:100%;object-fit:cover;display:block;}
.reel-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:10px;
}
.reel-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.2);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,.5);
  transition:all .2s;
}
.reel-card:hover .reel-play{background:rgba(255,255,255,.35);}
.reel-views{font-size:13px;font-weight:800;color:#fff;}
.reel-stats{display:flex;gap:8px;margin-top:3px;}
.reel-stat{font-size:10px;color:rgba(255,255,255,.75);}
.reel-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
}
.reel-loading .spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
.reel-loading p{font-size:10px;color:rgba(255,255,255,.6);}

/* why section */
.why-section{padding:0 20px 14px;}
.why-box{
  background:linear-gradient(135deg,#eef2ff,#f5f0ff);
  border:1px solid #c7d2fe;border-radius:14px;
  padding:16px;position:relative;overflow:hidden;
  box-shadow:0 2px 12px rgba(124,58,237,.08);
}
.why-box::before{content:"";position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(124,58,237,.06);}
.why-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#6d28d9;margin-bottom:8px;}
.why-text{font-size:13px;color:#4c4469;line-height:1.7;}
.why-ai-btn{
  margin-top:10px;background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;border:none;border-radius:8px;
  padding:6px 12px;font-size:11px;font-weight:700;
  font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:all .2s;
}
.why-ai-btn:hover{opacity:.9;}

/* notes */
.notes-section{padding:0 24px 22px;}
.notes-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;}
.notes-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#92400e;margin-bottom:6px;}
.notes-text{font-size:12px;color:#78350f;line-height:1.6;}

/* ugc badge */
.ugc-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:#dcfce7;border:1px solid #86efac;
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:700;color:#15803d;
}

/* ── DRAG REORDER ── */
.creator-card.drag-over{outline:2px dashed var(--blue);outline-offset:2px;}
.creator-card.dragging{opacity:.4;transform:scale(.98);}
.drag-handle{cursor:grab;color:var(--muted);padding:4px 6px;font-size:16px;line-height:1;user-select:none;flex-shrink:0;}
.drag-handle:active{cursor:grabbing;}

/* ── ADD CREATOR CTA ── */
.add-creator-cta{
  margin:0 32px 40px;
  border:2px dashed var(--border);border-radius:var(--radius);
  padding:32px;text-align:center;cursor:pointer;
  transition:all .2s;background:rgba(255,255,255,.5);
}
.add-creator-cta:hover{border-color:var(--blue);background:rgba(37,99,235,.03);}
.add-creator-cta h4{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.add-creator-cta p{font-size:12px;color:var(--muted);}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,14,23,.6);
  z-index:1000;display:flex;align-items:flex-start;justify-content:center;
  padding:20px 16px;overflow-y:auto;
  backdrop-filter:blur(4px);
}
.modal{
  background:#fff;border-radius:24px;width:100%;max-width:700px;
  box-shadow:0 32px 80px rgba(0,0,0,.3);
  animation:popIn .25s ease;
  margin:auto;
}
.modal-header{
  padding:22px 24px 18px;
  border-bottom:1px solid #f0ece6;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#fafaf8,#f5f1ea);
  border-radius:24px 24px 0 0;
}
.modal-header h2{font-family:'Playfair Display',serif;font-size:18px;color:#111;}
.modal-tabs{display:flex;gap:2px;background:#f0ece6;border-radius:10px;padding:3px;}
.modal-tab{
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;border:none;background:transparent;font-family:inherit;
  color:var(--muted);transition:all .15s;
}
.modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:16px 24px;border-top:1px solid #f0ece6;display:flex;justify-content:flex-end;gap:10px;}

/* form elements */
.field{margin-bottom:16px;}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.field input,.field textarea,.field select{
  width:100%;padding:10px 13px;
  border:1.5px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:13px;color:var(--ink);
  background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.field textarea{resize:vertical;min-height:80px;line-height:1.6;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.sec-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0ece6;}

/* reel url field */
.reel-url-row{display:flex;gap:8px;align-items:flex-start;}
.reel-url-row input{flex:1;}
.fetch-btn{
  padding:10px 14px;background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:12px;
  font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .2s;margin-top:0;
}
.fetch-btn:hover{opacity:.9;}
.fetch-btn:disabled{opacity:.5;cursor:wait;}
.reel-preview{
  margin-top:8px;background:linear-gradient(135deg,#f0f4ff,#f5f0ff);
  border:1px solid #e0e7ff;border-radius:10px;padding:10px 12px;
  font-size:11px;color:#4c4469;
}
.reel-preview .fetched-thumb{width:48px;height:84px;border-radius:6px;object-fit:cover;float:left;margin-right:10px;}

/* tags input */
.tags-wrap{
  display:flex;flex-wrap:wrap;gap:6px;
  border:1.5px solid var(--border);border-radius:10px;
  padding:7px 10px;min-height:42px;cursor:text;
  transition:border-color .15s;background:#fff;align-items:center;
}
.tags-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.tag-chip{
  display:flex;align-items:center;gap:4px;
  background:#dbeafe;color:#1d4ed8;border-radius:6px;
  padding:2px 8px;font-size:11px;font-weight:700;
}
.tag-chip button{background:none;border:none;color:#93c5fd;cursor:pointer;font-size:13px;line-height:1;padding:0;}
.tags-inp{border:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);flex:1;min-width:80px;background:transparent;}

/* deck sidebar */
.deck-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-radius:8px;cursor:pointer;
  transition:background .12s;margin-bottom:4px;
}
.deck-item:hover{background:#f5f1ea;}
.deck-item.active{background:#dbeafe;}
.deck-item-name{font-size:13px;font-weight:600;color:var(--ink);}
.deck-item-sub{font-size:10px;color:var(--muted);}

/* preview mode */
.preview-mode .no-print,.preview-mode .card-actions,.preview-mode .add-creator-cta,.preview-mode .toolbar-right .btn-ghost{
  display:none!important;
}
.preview-mode body{background:#fff;}

/* ── NEW PAGES ── */
.cover-page,.doc-page,.conclusion-page{
  position:relative;
  border-bottom:1px solid rgba(0,0,0,0.06);
}
/* All editable inputs in new pages */
.cover-page input,.cover-page textarea,
.doc-page input,.doc-page textarea,
.conclusion-page input,.conclusion-page textarea{
  font-family:inherit;
  transition:background .15s;
}
.cover-page input:hover,.cover-page textarea:hover,
.doc-page input:hover,.doc-page textarea:hover,
.conclusion-page input:hover,.conclusion-page textarea:hover{
  background:rgba(255,255,255,.07)!important;
  border-radius:4px;
}
.doc-page input:hover,.doc-page textarea:hover{
  background:rgba(0,0,0,.03)!important;
}
/* Internal-only badge */
.internal-only{display:block;}
/* In preview/PDF strip internal sections */
.preview-mode .internal-only{display:none!important;}

/* ── PRINT / PDF ── */
@media print{
  .toolbar,.deck-toolbar,.deck-stats,.no-print,.card-actions,.add-creator-cta,
  .why-ai-btn,.overflow-menu-wrapper,.internal-only{display:none!important;}
  body{background:#fff!important;background-image:none!important;}
  .creator-card{
    page-break-inside:avoid;
    page-break-after:always;
    break-inside:avoid;
    break-after:page;
    box-shadow:none!important;
    border:1px solid #e0dbd3!important;
    margin:0!important;
    border-radius:8px!important;
  }
  .creator-card:last-child{page-break-after:auto;break-after:auto;}
  .cards-wrap{padding:0 8px;gap:0;}
  .page-hero,.summary-wrap{page-break-after:avoid;break-after:avoid;page-break-inside:avoid;break-inside:avoid;}
  .card-header{background:linear-gradient(135deg,#fafaf8 0%,#f5f1ea 100%)!important;}
  .kpi-grid{grid-template-columns:repeat(4,1fr)!important;}
  .info-grid{grid-template-columns:1fr 1fr 1fr!important;}
  .reels-grid{grid-template-columns:repeat(3,1fr)!important;}
  .why-text{font-size:11px!important;}
  .soshman-footer{display:flex!important;}
  @page{margin:8mm;size:A4 portrait;}
}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .hero-title{font-size:22px;}
  .page-hero{padding:20px 14px 16px;flex-direction:column;}
  .deck-stats{padding:0 14px 16px;gap:8px;}
  .deck-toolbar{padding:0 14px 12px;}
  .summary-wrap{margin:0 14px 16px;}
  .cards-wrap{padding:0 14px;}
  .add-creator-cta{margin:0 14px 28px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .info-grid{grid-template-columns:1fr;}
  .reels-grid{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:1fr;}
  .g3{grid-template-columns:1fr 1fr;}
  .toolbar-left .obj-text{display:none;}
  .toolbar{padding:0 12px;gap:6px;height:52px;}
  .brand-input{width:100px;font-size:13px;}
  .card-header{flex-wrap:wrap;gap:10px;}
  .card-right{flex-direction:row;align-items:center;gap:10px;width:100%;}
  .modal{border-radius:16px;margin:8px;}
  .modal-body{max-height:60vh;}
  .summary-table th,.summary-table td{padding:7px 8px;font-size:10px;}
  .stat-pill{min-width:calc(50% - 6px);}
  .hero-title{line-height:1.2;}
  .hero-eyebrow{font-size:9px;}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .kpi-cell-val{font-size:14px;}
  .reels-grid{grid-template-columns:repeat(3,1fr);}
  .deck-stats{flex-wrap:wrap;}
  .stat-pill{min-width:calc(50% - 6px);}
  .hero-title{font-size:19px;}
  .card-right{flex-direction:row;justify-content:flex-start;gap:10px;}
  .g3{grid-template-columns:1fr;}
  .kpi-cell{padding:8px 6px;}
  .kpi-cell-label{font-size:8px;}
  .summary-table{display:none;}
  .bar-label{width:52px;font-size:10px;}
  .overflow-sub{left:auto;right:calc(100% + 6px);}
  .overflow-dropdown{right:0;left:auto;}
  #pdf-area{box-shadow:none;}
  .info-grid{gap:8px;}
  .info-box{padding:10px;}
  .card-header{padding:12px 14px 10px;}
}

/* ══ HELPERS ══ */
const autoCalcInteractions=(c)=>{
  const parse=v=>{
    if(!v)return 0;
    const s=String(v).replace(/,/g,'').trim();
    if(s.endsWith('M'))return parseFloat(s)*1000000;
    if(s.endsWith('K'))return parseFloat(s)*1000;
    return parseFloat(s)||0;
  };
  const total=parse(c.likes)+parse(c.comments)+parse(c.reposts)+parse(c.shares)+parse(c.saves);
  if(!total)return c.interactions;
  if(total>=1000000)return (total/1000000).toFixed(2)+'M';
  if(total>=1000)return (total/1000).toFixed(1)+'K';
  return String(total);
};

const autoCalcDays=(start,end)=>{
  if(!start||!end)return '';
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const parseDate=s=>{
    const m=s.match(/(\d+)\w*\s+(\w+)\s*(\d{4})?/i);
    if(!m)return null;
    const day=parseInt(m[1]);
    const mon=months.findIndex(x=>x.toLowerCase().startsWith(m[2].toLowerCase()));
    const yr=m[3]?parseInt(m[3]):2026;
    if(mon<0)return null;
    return new Date(yr,mon,day);
  };
  const d1=parseDate(start),d2=parseDate(end);
  if(!d1||!d2)return '';
  const diff=Math.round((d2-d1)/(1000*60*60*24));
  return diff>0?diff+' days':'';
};

const autoFitScore=(c)=>{
  const parse=v=>{const s=String(v||'').replace('%','').trim();return parseFloat(s)||0;};
  const eng=Math.min(parse(c.engagementRate)/10,1)*25;
  const women=Math.min(parse(c.audienceProfile?.women)/100,1)*25;
  const saves=parse(c.nonFollowerReach)/100*25;
  const ugc=c.ugcForMeta?10:0;
  const fit=Math.round(eng+women+saves+ugc+15);
  return Math.min(fit,100);
};
/* derive pillar sub-scores from creator data (each out of 100) */
const autoPillars=(c)=>{
  const parse=v=>{const s=String(v||'').replace('%','').trim();return parseFloat(s)||0;};
  return{
    niche: Math.min(Math.round((c.tags?.length||0)/5*100),100),
    audience: Math.min(Math.round(parse(c.audienceProfile?.women)),100),
    engagement: Math.min(Math.round(parse(c.engagementRate)/10*100),100),
    format: Math.min(Math.round(parse(c.contentPerf?.reels)),100),
  };
};

/* ══ REEL FETCH — oEmbed via CORS proxies ══ */
const extractShortcode=(url)=>{
  const m=url.match(/instagram\.com\/(?:reel|p)\/([A-Za-z0-9_-]+)/);
  return m?m[1]:null;
};
const fetchReelData=async(url)=>{
  const shortcode=extractShortcode(url);
  const result={views:'',likes:'',saves:'',comments:'',shares:'',thumb_url:'',error:''};
  if(!shortcode){result.error='Could not extract reel shortcode from URL.';return result;}

  const igOembedUrl=`https://www.instagram.com/oembed/?url=${encodeURIComponent(url)}&omitscript=true`;
  const noembedUrl=`https://noembed.com/embed?url=${encodeURIComponent(url)}`;

  // Try 1: allorigins proxy → Instagram oEmbed
  try{
    const proxyUrl=`https://api.allorigins.win/get?url=${encodeURIComponent(igOembedUrl)}`;
    const resp=await fetch(proxyUrl);
    if(resp.ok){
      const wrapper=await resp.json();
      if(wrapper.contents){
        const d=JSON.parse(wrapper.contents);
        if(d.thumbnail_url)result.thumb_url=d.thumbnail_url;
      }
    }
  }catch(e){}

  // Try 2: noembed.com (has CORS headers, no proxy needed)
  if(!result.thumb_url){
    try{
      const resp=await fetch(noembedUrl);
      if(resp.ok){
        const d=await resp.json();
        if(d.thumbnail_url)result.thumb_url=d.thumbnail_url;
      }
    }catch(e){}
  }

  // Try 3: allorigins proxy → noembed as last resort
  if(!result.thumb_url){
    try{
      const proxyUrl2=`https://api.allorigins.win/get?url=${encodeURIComponent(noembedUrl)}`;
      const resp=await fetch(proxyUrl2);
      if(resp.ok){
        const wrapper=await resp.json();
        if(wrapper.contents){
          const d=JSON.parse(wrapper.contents);
          if(d.thumbnail_url)result.thumb_url=d.thumbnail_url;
        }
      }
    }catch(e){}
  }

  result.error=result.thumb_url?'':'Could not auto-fetch thumbnail — please upload one manually below.';
  return result;
};

/* ══ EDITABLE FIELD ══ */
const EditableField=({value,onChange,placeholder,style={},multiline=false})=>{
  const base={border:'none',background:'transparent',outline:'none',font:'inherit',
    color:'inherit',width:'100%',fontFamily:'inherit',padding:0};
  if(multiline)return(
    <textarea value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{...base,resize:'vertical',lineHeight:1.7,...style}}/>
  );
  return(
    <input value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{...base,...style}}/>
  );
};

/* ══ PARSE CREATOR PROFILE TEXT ══ */
const parseProfileText=(text)=>{
  const get=(pattern,flags='i')=>{
    const m=text.match(new RegExp(pattern,flags));
    return m?m[1].trim():'';
  };
  const getArr=(pattern,flags='gi')=>{
    const m=[...text.matchAll(new RegExp(pattern,flags))];
    return m.map(x=>x[1].trim()).filter(Boolean);
  };

  const name=get('Name:\s*(.+)');
  const handle=get('Handle:\s*(@?\S+)');
  const city=get('City:\s*(.+)');
  const niche=get('Niche:\s*(.+)');
  const followers=get('Followers:\s*(\S+)');
  const periodRaw=get('Period:\s*(.+)');
  const [campStart='',campEnd='']=(periodRaw.includes('–')||periodRaw.includes('-'))?
    periodRaw.split(/[–-]/).map(s=>s.trim()):['',''];

  // KPIs
  const views=get('Total Views:\s*(\S+)');
  const reelViews=get('Reel Views:\s*(\S+)');
  const likes=get('Likes:\s*(\S+)');
  const comments=get('Comments:\s*(\S+)');
  const reposts=get('Reposts:\s*(\S+)');
  const shares=get('Shares:\s*(\S+)');
  const saves=get('Saves:\s*(\S+)');
  const interactions=get('Interactions:\s*(\S+)');
  const nonFollowerReach=get('Non-Follower Reach:\s*(\S+)');
  const bestReelViews=get('Best Reel Views:\s*(.+)');
  const ugcRaw=get('UGC for Meta Ads:\s*(.+)');
  const ugcForMeta=/yes/i.test(ugcRaw);

  // Audience cities — "Delhi 89% | Mumbai 44%"
  const cityLine=get('AUDIENCE[^\n]*CITIES?\n(.+)','i');
  const audienceCities=cityLine
    ?[...cityLine.matchAll(/([A-Za-z\s]+?)\s+(\d+%)/g)].map(m=>({city:m[1].trim(),pct:m[2]}))
    :[];

  // Audience profile
  const womenRaw=get('Women:\s*(\S+)');
  const menRaw=get('Men:\s*(\S+)');
  const age1824Raw=get('Age 18[–-]24:\s*(\S+)');
  const age2534Raw=get('Age 25[–-]34:\s*(\S+)');
  const topCountryRaw=get('Top country:\s*(.+)');

  // Content perf
  const reelsPct=get('Reels:\s*(\S+)');
  const storiesPct=get('Stories:\s*(\S+)');
  const postsPct=get('Posts:\s*(\S+)');

  // Past brands — "Hyphen (Skincare), AU99 (Perfumes)"
  const pastBrandLine=get('PAST BRAND WORK\n(.+)','i');
  const pastBrands=pastBrandLine
    ?[...pastBrandLine.matchAll(/([A-Za-z0-9&\s]+?)\s*\(([^)]+)\)/g)].map(m=>({name:m[1].trim(),cat:m[2].trim()}))
    :[];

  // Top Reels — "1M — url | 2M — url"
  const reelLine=get('TOP REELS\n(.+)','i');
  const parsedReels=reelLine
    ?[...reelLine.matchAll(/(\S+)\s*[–—-]\s*(https?:\/\/\S+)/g)].map((m,i)=>({
        id:i+1,url:m[2],views:m[1],likes:'',saves:'',comments:'',shares:'',thumb:null,loading:false
      }))
    :[{id:1,url:'',views:'',likes:'',saves:'',comments:'',shares:'',thumb:null,loading:false},
      {id:2,url:'',views:'',likes:'',saves:'',comments:'',shares:'',thumb:null,loading:false},
      {id:3,url:'',views:'',likes:'',saves:'',comments:'',shares:'',thumb:null,loading:false}];
  while(parsedReels.length<3)parsedReels.push({id:parsedReels.length+1,url:'',views:'',likes:'',saves:'',comments:'',shares:'',thumb:null,loading:false});

  const tags=niche?niche.split(/[,;/]+/).map(s=>s.trim()).filter(Boolean):[];

  return{
    name,handle:handle.startsWith('@')?handle:'@'+handle,city,tags,followers,
    campaignStart:campStart,campaignEnd:campEnd,
    views,reelViews,likes,comments,reposts,shares,saves,interactions,
    nonFollowerReach,bestReelViews,ugcForMeta,
    audienceCities:audienceCities.length?audienceCities:[{city:'',pct:''},{city:'',pct:''},{city:'',pct:''},{city:'',pct:''}],
    audienceProfile:{women:womenRaw,men:menRaw,age1824:age1824Raw,age2534:age2534Raw,topCountry:topCountryRaw||'India'},
    contentPerf:{reels:reelsPct,stories:storiesPct,posts:postsPct},
    pastBrands:pastBrands.length?pastBrands:[{name:'',cat:''},{name:'',cat:''}],
    reels:parsedReels.slice(0,3),
  };
};

const EditorModal=({creator,globalStart,globalEnd,onSave,onClose})=>{
  const [c,setC]=useState(JSON.parse(JSON.stringify(creator)));
  const [tab,setTab]=useState('basic');
  const [importText,setImportText]=useState('');
  const [importDone,setImportDone]=useState(false);
  const avatarRef=useRef();

  const set=(k,v)=>setC(p=>({...p,[k]:v}));
  const setProfile=(k,v)=>setC(p=>({...p,audienceProfile:{...p.audienceProfile,[k]:v}}));
  const setPerf=(k,v)=>setC(p=>({...p,contentPerf:{...p.contentPerf,[k]:v}}));
  const setCity=(i,f,v)=>setC(p=>{const a=[...p.audienceCities];a[i]={...a[i],[f]:v};return{...p,audienceCities:a};});
  const setBrand=(i,f,v)=>setC(p=>{const a=[...p.pastBrands];a[i]={...a[i],[f]:v};return{...p,pastBrands:a};});
  const setReel=(i,f,v)=>setC(p=>{const a=[...p.reels];a[i]={...a[i],[f]:v};return{...p,reels:a};});

  const handleAvatar=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>set('avatar',ev.target.result);r.readAsDataURL(f);};

  // Auto-calc interactions when KPIs change
  useEffect(()=>{
    const calc=autoCalcInteractions(c);
    if(calc!==c.interactions)setC(p=>({...p,interactions:calc}));
  },[c.likes,c.comments,c.reposts,c.shares,c.saves]);

  // Auto-calc fit score (only when override is OFF)
  useEffect(()=>{
    if(c.fitOverride)return;
    const score=autoFitScore(c);
    setC(p=>({...p,fitScore:String(score)}));
  },[c.engagementRate,c.audienceProfile?.women,c.nonFollowerReach,c.ugcForMeta,c.fitOverride]);

  // Fetch reel data
  const fetchReel=async(i)=>{
    const url=c.reels[i].url;
    if(!url)return;
    setReel(i,'loading',true);
    setReel(i,'fetchError','');
    const data=await fetchReelData(url);
    setC(p=>{
      const a=[...p.reels];
      a[i]={...a[i],loading:false};
      if(data.views)a[i].views=data.views;
      if(data.likes)a[i].likes=data.likes;
      if(data.saves)a[i].saves=data.saves;
      if(data.comments)a[i].comments=data.comments;
      if(data.shares)a[i].shares=data.shares;
      if(data.thumb_url)a[i].thumb=data.thumb_url;
      a[i].fetchError=data.error||'';
      return{...p,reels:a};
    });
  };

  // Manual thumbnail upload per reel
  const handleThumbUpload=(i,e)=>{
    const f=e.target.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      setReel(i,'thumb',ev.target.result);
      setReel(i,'fetchError','');
    };
    r.readAsDataURL(f);
  };
  const thumbRefs=[React.useRef(),React.useRef(),React.useRef()];

  // Tags
  const [tagInput,setTagInput]=useState('');
  const addTag=(v)=>{v=v.trim();if(!v||c.tags.includes(v))return;setC(p=>({...p,tags:[...p.tags,v]}));};
  const removeTag=(t)=>setC(p=>({...p,tags:p.tags.filter(x=>x!==t)}));

  const inp={};// handled by CSS

  const TABS=[['basic','👤 Basic'],['metrics','📊 Metrics'],['reels','▶ Reels'],['audience','👥 Audience'],['brands','🤝 Brands'],['notes','📝 Notes'],['import','⬆ Import']];

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="modal-header">
          <h2>Edit Creator</h2>
          <button className="btn btn-ghost btn-icon" onClick={onClose} style={{fontSize:16}}>✕</button>
        </div>
        <div style={{padding:'14px 24px 0',borderBottom:'1px solid #f0ece6',overflowX:'auto'}}>
          <div style={{display:'flex',gap:2,background:'#f0ece6',borderRadius:10,padding:3,width:'fit-content'}}>
            {TABS.map(([id,label])=>(
              <button key={id} className={`modal-tab${tab===id?' active':''}`} onClick={()=>setTab(id)}>{label}</button>
            ))}
          </div>
        </div>

        <div className="modal-body">

          {/* ── BASIC ── */}
          {tab==='basic'&&(
            <div>
              {/* Avatar */}
              <div className="field">
                <label>Profile Photo</label>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                  {c.avatar
                    ?<img src={c.avatar} style={{width:60,height:60,borderRadius:'50%',objectFit:'cover',border:'2px solid #e8e4de'}} alt="av"/>
                    :<div style={{width:60,height:60,borderRadius:'50%',background:'linear-gradient(135deg,#2563eb,#7c3aed)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,fontWeight:800,color:'#fff'}}>{(c.name||'?')[0].toUpperCase()}</div>}
                  <div style={{display:'flex',gap:7}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>avatarRef.current.click()}>Upload Photo</button>
                    {c.avatar&&<button className="btn btn-sm" style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fecaca'}} onClick={()=>set('avatar',null)}>Remove</button>}
                    <input ref={avatarRef} type="file" accept="image/*" onChange={handleAvatar} style={{display:'none'}}/>
                  </div>
                </div>
              </div>
              <div className="g2">
                <div className="field"><label>Full Name</label><input value={c.name} onChange={e=>set('name',e.target.value)}/></div>
                <div className="field"><label>Instagram Handle</label><input value={c.handle} onChange={e=>set('handle',e.target.value)} placeholder="@handle"/></div>
              </div>
              <div className="g2">
                <div className="field"><label>City / State</label><input value={c.city} onChange={e=>set('city',e.target.value)}/></div>
                <div className="field"><label>Language</label><input value={c.language} onChange={e=>set('language',e.target.value)}/></div>
              </div>
              <div className="field"><label>Followers</label><input value={c.followers} onChange={e=>set('followers',e.target.value)} placeholder="e.g. 192K"/></div>

              {/* ── BRAND FIT SCORE PANEL ── */}
              <div style={{background:'linear-gradient(135deg,#f5f0ff,#eef2ff)',border:'1px solid #ddd6fe',
                borderRadius:14,padding:'14px 16px',marginBottom:4}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:800,color:'#4c1d95',letterSpacing:'.04em',textTransform:'uppercase'}}>
                    🎯 Brand Fit Score
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:10,color:'#888'}}>Manual override</span>
                    <div style={{
                      width:34,height:18,borderRadius:99,
                      background:c.fitOverride?'#7c3aed':'#d1d5db',
                      position:'relative',cursor:'pointer',transition:'background .2s',flexShrink:0,
                    }} onClick={()=>set('fitOverride',!c.fitOverride)}>
                      <div style={{position:'absolute',top:2,left:c.fitOverride?16:2,width:14,height:14,
                        borderRadius:'50%',background:'#fff',transition:'left .2s',
                        boxShadow:'0 1px 4px rgba(0,0,0,.2)'}}/>
                    </div>
                  </div>
                </div>

                {/* Brand Name for personalisation */}
                <div className="field" style={{marginBottom:12}}>
                  <label style={{color:'#6d28d9'}}>Brand Name (personalises the score label)</label>
                  <input value={c.fitBrandName||''} onChange={e=>set('fitBrandName',e.target.value)}
                    placeholder="e.g. Nykaa · shows as 85% · Nykaa fit on card"
                    style={{borderColor:'#c4b5fd'}}/>
                </div>

                {/* Overall score — manual or auto */}
                <div className="field" style={{marginBottom:12}}>
                  <label style={{color:'#6d28d9'}}>{c.fitOverride?'Overall Score (manual)':'Overall Score (auto-calculated)'}</label>
                  <div style={{display:'flex',gap:10,alignItems:'center'}}>
                    <input
                      value={c.fitScore} onChange={e=>set('fitScore',e.target.value)}
                      readOnly={!c.fitOverride}
                      placeholder="0–100"
                      style={{flex:1,borderColor:c.fitOverride?'#7c3aed':'#e5e7eb',
                        background:c.fitOverride?'#fff':'#f9f7f3',
                        color:c.fitOverride?'#0f0e17':'#999'}}/>
                    <div style={{
                      width:36,height:36,borderRadius:'50%',flexShrink:0,
                      background:parseInt(c.fitScore)>=80?'#059669':parseInt(c.fitScore)>=60?'#d97706':'#dc2626',
                      display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:13,fontWeight:900,color:'#fff',
                    }}>{parseInt(c.fitScore)||0}</div>
                  </div>
                </div>

                {/* 4 Pillar sub-scores */}
                <div style={{fontSize:10,fontWeight:700,color:'#6d28d9',marginBottom:8,textTransform:'uppercase',letterSpacing:'.06em'}}>
                  Pillar Breakdown (shown in hover tooltip)
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  {[
                    ['niche','Niche Overlap','#7c3aed'],
                    ['audience','Audience Demo','#2563eb'],
                    ['engagement','Engagement Quality','#059669'],
                    ['format','Content Format','#d97706'],
                  ].map(([key,label,col])=>(
                    <div key={key} style={{background:'#fff',borderRadius:10,padding:'8px 10px',
                      border:`1px solid ${col}30`}}>
                      <div style={{fontSize:9,fontWeight:700,color:col,textTransform:'uppercase',
                        letterSpacing:'.06em',marginBottom:4}}>{label}</div>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <input
                          type="number" min="0" max="100"
                          value={c.fitPillars?.[key]||''}
                          onChange={e=>{
                            const v=Math.min(100,Math.max(0,parseInt(e.target.value)||0));
                            setC(p=>({...p,fitPillars:{...p.fitPillars,[key]:v}}));
                          }}
                          placeholder="0–100"
                          style={{flex:1,border:'1px solid #e5e7eb',borderRadius:8,padding:'5px 8px',
                            fontSize:12,fontWeight:700,color:col,textAlign:'center',
                            fontFamily:'JetBrains Mono,monospace'}}/>
                        <span style={{fontSize:10,color:'#bbb'}}>%</span>
                      </div>
                      {/* Mini bar preview */}
                      <div style={{height:3,background:'#f0ece6',borderRadius:99,marginTop:5,overflow:'hidden'}}>
                        <div style={{height:'100%',width:(c.fitPillars?.[key]||0)+'%',
                          background:col,borderRadius:99,transition:'width .3s'}}/>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{marginTop:10,fontSize:10,color:'#a78bfa',lineHeight:1.5,textAlign:'center'}}>
                  {c.fitOverride
                    ?'Manual override active — auto-calc paused. Card will show your set score.'
                    :'Auto-calc is on. Toggle override to set a custom score.'}
                </div>
              </div>
              <div className="g3">
                <div className="field"><label>Campaign Start</label><input value={c.campaignStart} onChange={e=>set('campaignStart',e.target.value)} placeholder="4th April 2026"/></div>
                <div className="field"><label>Campaign End</label><input value={c.campaignEnd} onChange={e=>set('campaignEnd',e.target.value)} placeholder="4th May 2026"/></div>
                <div className="field"><label>Days (auto)</label><input value={autoCalcDays(c.campaignStart||globalStart,c.campaignEnd||globalEnd)||c.campaignDays} readOnly style={{background:'#f9f7f3',color:'#888'}}/></div>
              </div>
              <div className="field">
                <label>Niche Tags</label>
                <div className="tags-wrap" onClick={()=>document.getElementById('tag-inp-'+c.id)?.focus()}>
                  {c.tags.map(t=>(
                    <div key={t} className="tag-chip">{t}<button onClick={()=>removeTag(t)}>×</button></div>
                  ))}
                  <input id={'tag-inp-'+c.id} className="tags-inp" value={tagInput} placeholder="Add tag…"
                    onChange={e=>setTagInput(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(tagInput);setTagInput('');}
                      if(e.key==='Backspace'&&!tagInput&&c.tags.length){removeTag(c.tags[c.tags.length-1]);}}}/>
                </div>
              </div>
              <div className="g2">
                <div className="field">
                  <label>Brand Fit</label>
                  <div style={{display:'flex',gap:8,marginTop:4}}>
                    <button className={`btn btn-sm ${c.brandFit?'btn-blue':'btn-ghost'}`} onClick={()=>set('brandFit',true)}>✓ Yes</button>
                    <button className={`btn btn-sm ${!c.brandFit?'btn-dark':'btn-ghost'}`} onClick={()=>set('brandFit',false)}>✗ No</button>
                  </div>
                </div>
                <div className="field">
                  <label>Open to UGC / Meta Ads</label>
                  <div style={{display:'flex',gap:8,marginTop:4}}>
                    <button className={`btn btn-sm ${c.ugcForMeta?'btn-blue':'btn-ghost'}`} onClick={()=>set('ugcForMeta',true)}>✓ Yes</button>
                    <button className={`btn btn-sm ${!c.ugcForMeta?'btn-dark':'btn-ghost'}`} onClick={()=>set('ugcForMeta',false)}>✗ No</button>
                  </div>
                </div>
              </div>
              <div className="field">
                <label>Why This Creator</label>
                <textarea value={c.whyText} onChange={e=>set('whyText',e.target.value)} placeholder="AI-generated or manual analysis…" style={{minHeight:100}}/>
              </div>
            </div>
          )}

          {/* ── METRICS ── */}
          {tab==='metrics'&&(
            <div>
              <div className="sec-head">Last 30 Days Performance</div>
              <div className="g3">
                <div className="field"><label>Total Views</label><input value={c.views} onChange={e=>set('views',e.target.value)} placeholder="2.1M"/></div>
                <div className="field"><label>Reel Views</label><input value={c.reelViews} onChange={e=>set('reelViews',e.target.value)} placeholder="7.5M"/></div>
                <div className="field"><label>Likes</label><input value={c.likes} onChange={e=>set('likes',e.target.value)} placeholder="617K"/></div>
              </div>
              <div className="g3">
                <div className="field"><label>Comments</label><input value={c.comments} onChange={e=>set('comments',e.target.value)} placeholder="24.3K"/></div>
                <div className="field"><label>Reposts</label><input value={c.reposts} onChange={e=>set('reposts',e.target.value)} placeholder="18.6K"/></div>
                <div className="field"><label>Shares</label><input value={c.shares} onChange={e=>set('shares',e.target.value)} placeholder="134K"/></div>
              </div>
              <div className="g3">
                <div className="field"><label>Saves</label><input value={c.saves} onChange={e=>set('saves',e.target.value)} placeholder="81K"/></div>
                <div className="field"><label>Interactions (auto)</label><input value={c.interactions} onChange={e=>set('interactions',e.target.value)} placeholder="1.33M" style={{background:'#f9f7f3'}}/></div>
                <div className="field"><label>Engagement Rate</label><input value={c.engagementRate} onChange={e=>set('engagementRate',e.target.value)} placeholder="4.2%"/></div>
              </div>
              <div className="g2">
                <div className="field"><label>Non-Follower Reach</label><input value={c.nonFollowerReach} onChange={e=>set('nonFollowerReach',e.target.value)} placeholder="79.9%"/></div>
                <div className="field"><label>Best Reel Views</label><input value={c.bestReelViews} onChange={e=>set('bestReelViews',e.target.value)} placeholder="79K / 68K / 67K"/></div>
              </div>
              <div className="sec-head" style={{marginTop:4}}>Content Format Split</div>
              <div className="g3">
                <div className="field"><label>Reels %</label><input value={c.contentPerf?.reels} onChange={e=>setPerf('reels',e.target.value)} placeholder="88.5%"/></div>
                <div className="field"><label>Stories %</label><input value={c.contentPerf?.stories} onChange={e=>setPerf('stories',e.target.value)} placeholder="8.3%"/></div>
                <div className="field"><label>Posts %</label><input value={c.contentPerf?.posts} onChange={e=>setPerf('posts',e.target.value)} placeholder="3.2%"/></div>
              </div>
            </div>
          )}

          {/* ── REELS ── */}
          {tab==='reels'&&(
            <div>
              <div className="sec-head">Top 3 Reels — Paste URL to auto-fetch thumbnail & metrics</div>
              {c.reels.map((r,i)=>(
                <div key={r.id} style={{marginBottom:20,background:'#f9f7f3',borderRadius:14,padding:16,border:'1px solid #ede9e2'}}>
                  <div style={{fontSize:11,fontWeight:700,color:'#888',marginBottom:12,textTransform:'uppercase',letterSpacing:'.08em'}}>Reel #{i+1}</div>

                  {/* URL + Fetch */}
                  <div className="reel-url-row">
                    <div className="field" style={{flex:1,marginBottom:0}}>
                      <label>Instagram Reel URL</label>
                      <input value={r.url} onChange={e=>setReel(i,'url',e.target.value)} placeholder="https://www.instagram.com/reel/..."/>
                    </div>
                    <button className="fetch-btn" onClick={()=>fetchReel(i)} disabled={r.loading||!r.url} style={{marginTop:22}}>
                      {r.loading?'Fetching…':'⚡ Auto-Fetch'}
                    </button>
                  </div>

                  {/* Thumbnail row: preview + upload */}
                  <div style={{display:'flex',gap:14,alignItems:'flex-start',marginTop:12,
                    background:'#fff',borderRadius:10,padding:'12px 14px',border:'1px solid #e8e3db'}}>

                    {/* Thumb preview */}
                    <div style={{flexShrink:0}}>
                      {r.loading
                        ? <div style={{width:54,height:96,borderRadius:8,background:'linear-gradient(135deg,#1e293b,#334155)',
                            display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6}}>
                            <div style={{width:18,height:18,border:'2px solid rgba(255,255,255,.2)',borderTopColor:'#fff',
                              borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
                            <span style={{fontSize:8,color:'rgba(255,255,255,.5)'}}>fetching</span>
                          </div>
                        : r.thumb
                          ? <div style={{position:'relative'}}>
                              <img src={r.thumb} style={{width:54,height:96,borderRadius:8,objectFit:'cover',display:'block',
                                border:'2px solid #e0dbd3'}} alt="thumb" onError={e=>{e.target.style.display='none';setReel(i,'thumb',null);}}/>
                              <button onClick={()=>setReel(i,'thumb',null)}
                                style={{position:'absolute',top:-6,right:-6,width:18,height:18,borderRadius:'50%',
                                  background:'#dc2626',border:'none',color:'#fff',fontSize:9,fontWeight:700,
                                  cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1}}>✕</button>
                            </div>
                          : <div style={{width:54,height:96,borderRadius:8,
                              background:'linear-gradient(135deg,#1e293b 0%,#334155 50%,#0f172a 100%)',
                              display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,
                              border:'2px dashed #475569',cursor:'pointer'}}
                              onClick={()=>thumbRefs[i].current&&thumbRefs[i].current.click()}>
                              <span style={{fontSize:16,opacity:.5}}>▶</span>
                              <span style={{fontSize:7,color:'rgba(255,255,255,.4)',textAlign:'center',lineHeight:1.3,padding:'0 4px'}}>no thumb</span>
                            </div>
                      }
                    </div>

                    {/* Status + upload controls */}
                    <div style={{flex:1,minWidth:0}}>
                      {r.thumb&&!r.loading&&(
                        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                          <span style={{background:'#dcfce7',border:'1px solid #86efac',borderRadius:6,
                            padding:'2px 8px',fontSize:10,fontWeight:700,color:'#15803d'}}>✓ Thumbnail ready</span>
                        </div>
                      )}
                      {r.fetchError&&!r.thumb&&(
                        <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,
                          padding:'7px 10px',fontSize:11,color:'#991b1b',marginBottom:8,lineHeight:1.5}}>
                          ⚠ {r.fetchError}
                        </div>
                      )}
                      {!r.thumb&&!r.loading&&!r.fetchError&&r.url&&(
                        <div style={{fontSize:11,color:'#aaa',marginBottom:8}}>Click ⚡ Auto-Fetch to pull thumbnail from Instagram</div>
                      )}
                      {!r.url&&!r.thumb&&(
                        <div style={{fontSize:11,color:'#aaa',marginBottom:8}}>Paste a reel URL above, or upload a thumbnail directly</div>
                      )}

                      {/* Manual upload button */}
                      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                        <button
                          onClick={()=>thumbRefs[i].current&&thumbRefs[i].current.click()}
                          style={{background:'linear-gradient(135deg,#7c3aed,#6d28d9)',color:'#fff',
                            border:'none',borderRadius:8,padding:'6px 13px',fontSize:11,fontWeight:700,
                            cursor:'pointer',display:'flex',alignItems:'center',gap:5,fontFamily:'inherit'}}>
                          📁 {r.thumb?'Replace Thumbnail':'Upload Thumbnail'}
                        </button>
                        {r.thumb&&(
                          <button onClick={()=>setReel(i,'thumb',null)}
                            style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,
                              padding:'6px 11px',fontSize:11,fontWeight:600,color:'#dc2626',cursor:'pointer',fontFamily:'inherit'}}>
                            Remove
                          </button>
                        )}
                        <input ref={thumbRefs[i]} type="file" accept="image/*"
                          onChange={e=>handleThumbUpload(i,e)} style={{display:'none'}}/>
                        <span style={{fontSize:10,color:'#bbb'}}>JPG, PNG, WEBP</span>
                      </div>
                    </div>
                  </div>

                  {/* Metrics */}
                  <div className="g3" style={{marginTop:12}}>
                    <div className="field"><label>Views</label><input value={r.views} onChange={e=>setReel(i,'views',e.target.value)} placeholder="79K"/></div>
                    <div className="field"><label>Likes</label><input value={r.likes} onChange={e=>setReel(i,'likes',e.target.value)} placeholder="12.4K"/></div>
                    <div className="field"><label>Saves</label><input value={r.saves} onChange={e=>setReel(i,'saves',e.target.value)} placeholder="3.1K"/></div>
                  </div>
                  <div className="g2">
                    <div className="field"><label>Comments</label><input value={r.comments} onChange={e=>setReel(i,'comments',e.target.value)} placeholder="1.2K"/></div>
                    <div className="field"><label>Shares</label><input value={r.shares} onChange={e=>setReel(i,'shares',e.target.value)} placeholder="4.5K"/></div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── AUDIENCE ── */}
          {tab==='audience'&&(
            <div>
              <div className="sec-head">Gender Split</div>
              <div className="g2">
                <div className="field"><label>Women %</label><input value={c.audienceProfile?.women} onChange={e=>setProfile('women',e.target.value)} placeholder="72.4%"/></div>
                <div className="field"><label>Men %</label><input value={c.audienceProfile?.men} onChange={e=>setProfile('men',e.target.value)} placeholder="27.6%"/></div>
              </div>
              <div className="sec-head">Age Split</div>
              <div className="g2">
                <div className="field"><label>Age 18–24 %</label><input value={c.audienceProfile?.age1824} onChange={e=>setProfile('age1824',e.target.value)} placeholder="47.4%"/></div>
                <div className="field"><label>Age 25–34 %</label><input value={c.audienceProfile?.age2534} onChange={e=>setProfile('age2534',e.target.value)} placeholder="16.8%"/></div>
              </div>
              <div className="field"><label>Top Country</label><input value={c.audienceProfile?.topCountry} onChange={e=>setProfile('topCountry',e.target.value)} placeholder="India 88%"/></div>
              <div className="sec-head">Top Cities</div>
              {c.audienceCities.map((x,i)=>(
                <div key={i} className="g2" style={{marginBottom:8}}>
                  <div className="field" style={{marginBottom:0}}><label>City {i+1}</label><input value={x.city} onChange={e=>setCity(i,'city',e.target.value)} placeholder="Delhi"/></div>
                  <div className="field" style={{marginBottom:0}}><label>% Share</label><input value={x.pct} onChange={e=>setCity(i,'pct',e.target.value)} placeholder="28%"/></div>
                </div>
              ))}
            </div>
          )}

          {/* ── BRANDS ── */}
          {tab==='brands'&&(
            <div>
              <div className="sec-head">Past Brand Collaborations</div>
              {c.pastBrands.map((b,i)=>(
                <div key={i} className="g2" style={{marginBottom:10}}>
                  <div className="field" style={{marginBottom:0}}><label>Brand Name</label><input value={b.name} onChange={e=>setBrand(i,'name',e.target.value)} placeholder="Nykaa"/></div>
                  <div className="field" style={{marginBottom:0}}><label>Category</label><input value={b.cat} onChange={e=>setBrand(i,'cat',e.target.value)} placeholder="Beauty"/></div>
                </div>
              ))}
              <button className="btn btn-ghost btn-sm" style={{marginTop:4}} onClick={()=>setC(p=>({...p,pastBrands:[...p.pastBrands,{name:'',cat:''}]}))}>+ Add Brand</button>
            </div>
          )}

          {/* ── NOTES ── */}
          {tab==='notes'&&(
            <div>
              <div className="sec-head">Internal Notes (hidden from exported PDF)</div>
              <div className="field">
                <label>Your private notes</label>
                <textarea value={c.notes||''} onChange={e=>set('notes',e.target.value)} placeholder="Rates, contact info, negotiation notes, availability…" style={{minHeight:180}}/>
              </div>
            </div>
          )}

          {/* ── IMPORT FROM TEXT ── */}
          {tab==='import'&&(
            <div>
              <div className="sec-head">Auto-Import from SoshMan Creator Profile</div>
              <p style={{fontSize:12,color:'#888',marginBottom:14,lineHeight:1.7}}>
                Paste the full creator profile text below (in the standard SoshMan format).<br/>
                All fields will be auto-filled — you can review and edit after importing.
              </p>
              <div className="field">
                <label>Paste Profile Text</label>
                <textarea
                  value={importText}
                  onChange={e=>{setImportText(e.target.value);setImportDone(false);}}

/* ══ MAIN APP ══ */
function App(){
  const stored=load();
  const [decks,setDecks]=useState(stored?.decks||[DEFAULT_DECK()]);
  const [activeDeckId,setActiveDeckId]=useState(stored?.activeDeckId||null);
  const [editingId,setEditingId]=useState(null);
  const [showDecks,setShowDecks]=useState(false);
  const [previewMode,setPreviewMode]=useState(false);
  const [savedFlash,setSavedFlash]=useState(false);
  const [search,setSearch]=useState('');
  const [filterTag,setFilterTag]=useState('');
  const [undoStack,setUndoStack]=useState([]);
  const dragSrc=useRef(null);
  const [snapshots,setSnapshots]=useState([]);
  const [showSnapshots,setShowSnapshots]=useState(false);
  const [shareToast,setShareToast]=useState('');

  // Shared deck read-only mode
  const sharedHash=getShareHash();
  const [sharedDeck]=useState(()=>sharedHash?decodeShare(sharedHash):null);
  const isSharedView=!!sharedDeck;



  const handleDragStart=(id)=>{dragSrc.current=id;};
  const handleDragOver=(id)=>{};
  const handleDrop=(targetId)=>{
    if(!dragSrc.current||dragSrc.current===targetId)return;
    setCreators(cs=>{
      const src=cs.findIndex(c=>c.id===dragSrc.current);
      const tgt=cs.findIndex(c=>c.id===targetId);
      if(src<0||tgt<0)return cs;
      const next=[...cs];
      const [moved]=next.splice(src,1);
      next.splice(tgt,0,moved);
      return next;
    });
  };
  const handleDragEnd=()=>{dragSrc.current=null;};

  const activeDeck=decks.find(d=>d.id===(activeDeckId||decks[0]?.id))||decks[0];

  // persist
  useEffect(()=>{
    save({decks,activeDeckId});
    window._brandName=activeDeck?.brandName||'Brand';
    setSavedFlash(true);
    const t=setTimeout(()=>setSavedFlash(false),2100);
    return()=>clearTimeout(t);
  },[decks,activeDeckId]);

  const updateDeck=(fn)=>setDecks(prev=>prev.map(d=>d.id===activeDeck.id?fn(d):d));

  const setCreators=(fn)=>updateDeck(d=>({...d,creators:typeof fn==='function'?fn(d.creators):fn}));

  const addCreator=()=>{
    const nc=BLANK();
    nc.campaignStart=activeDeck.campaignStart||'';
    nc.campaignEnd=activeDeck.campaignEnd||'';
    setCreators(cs=>[...cs,nc]);
  };

  const deleteCreator=(id)=>{
    const c=activeDeck.creators.find(x=>x.id===id);
    setUndoStack(p=>[...p.slice(-4),{type:'delete',creator:c}]);
    setCreators(cs=>cs.filter(c=>c.id!==id));
  };


  const takeSnapshot=()=>{
    const snap={
      id:Date.now(),
      ts:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),
      deck:JSON.parse(JSON.stringify(activeDeck)),
    };
    setSnapshots(p=>[snap,...p.slice(0,9)]);
  };

  const restoreSnapshot=(snap)=>{
    setDecks(prev=>prev.map(d=>d.id===activeDeck.id?{...snap.deck,id:d.id}:d));
    setShowSnapshots(false);
  };

  const copyShareLink=()=>{
    const hash=encodeShare(activeDeck);
    if(!hash){setShareToast('Failed to encode deck');setTimeout(()=>setShareToast(''),2500);return;}
    const url=window.location.href.split('#')[0]+'#share='+hash;
    const doFallback=()=>prompt('Copy this shareable link:',url);
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>{
          setShareToast('Link copied! Share it as a read-only view.');
          setTimeout(()=>setShareToast(''),3000);
        }).catch(doFallback);
      } else {
        // execCommand fallback for browsers that block clipboard API
        const ta=document.createElement('textarea');
        ta.value=url;ta.style.cssText='position:fixed;opacity:0;top:0;left:0;';
        document.body.appendChild(ta);ta.focus();ta.select();
        const ok=document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){setShareToast('Link copied! Share it as a read-only view.');setTimeout(()=>setShareToast(''),3000);}
        else doFallback();
      }
    } catch(e){ doFallback(); }
  };


  const undo=()=>{
    const last=undoStack[undoStack.length-1];
    if(!last)return;
    if(last.type==='delete'){setCreators(cs=>[...cs,last.creator]);}
    setUndoStack(p=>p.slice(0,-1));
  };

  const duplicateCreator=(id)=>{
    const orig=activeDeck.creators.find(c=>c.id===id);
    if(!orig)return;
    const dup={...JSON.parse(JSON.stringify(orig)),id:uid(),name:orig.name+' (copy)'};
    setCreators(cs=>{const i=cs.findIndex(c=>c.id===id);const n=[...cs];n.splice(i+1,0,dup);return n;});
  };

  const saveCreator=(updated)=>{
    setCreators(cs=>cs.map(c=>c.id===updated.id?updated:c));

  };

  const generateWhy=async(id)=>{
