          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <img src={window.SOSHMAN_LOGO_URI} style={{height:28,width:'auto'}} alt="SoshMan"/>
            <span style={{fontSize:12,opacity:.7}}>Read-only shared view</span>
          </div>
          <span style={{fontSize:11,opacity:.6}}>Shared by SoshMan</span>
        </div>
        <SummaryTable creators={sharedDeck.creators}/>
        <div className="cards-wrap" style={{paddingBottom:40}}>
          {sharedDeck.creators.map(c=>(
            <CreatorCard key={c.id} creator={c}
              campaignStart={sharedDeck.campaignStart}
              campaignEnd={sharedDeck.campaignEnd}
              onEdit={()=>{}} onDelete={()=>{}} onDuplicate={()=>{}}
              onGenerateWhy={()=>{}}
              onDragStart={()=>{}} onDragOver={()=>{}} onDrop={()=>{}} onDragEnd={()=>{}}/>
          ))}
        </div>
      </div>
    );
  }

  return(
    <>
      {/* ── TOOLBAR ── */}
      <div className="toolbar no-print">
        <div className="toolbar-left">
          <Logo height={32} className="toolbar-logo"/>
          <div className="toolbar-div"/>
          <div className="toolbar-div"/>
          <input className="brand-input" value={activeDeck.brandName} onChange={e=>updateDeck(d=>({...d,brandName:e.target.value}))} placeholder="Brand name…"/>
          <div className="toolbar-div"/>
          <span className="obj-text" onClick={()=>{const n=prompt('Campaign objective:',activeDeck.campaignObjective);if(n!==null)updateDeck(d=>({...d,campaignObjective:n}));}}>
            ✎ {activeDeck.campaignObjective||'Set objective…'}
          </span>
        </div>
        <div className="toolbar-right">
          <span className={`saved-badge${savedFlash?' show':''}`}>✓ Saved</span>
          {undoStack.length>0&&<button className="btn btn-ghost btn-sm" onClick={undo}>↩ Undo</button>}
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowDecks(true)}>📁 Decks ({decks.length})</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setPreviewMode(p=>!p)}>{previewMode?'✏ Edit':'👁 Preview'}</button>
          <button className="btn btn-blue btn-sm" onClick={addCreator}>+ Creator</button>
          <OverflowMenu
            onSavePDF={downloadPDF}
            onSaveHTML={downloadHTML}
            onShare={copyShareLink}
          />
        </div>
      </div>

      {/* Preview mode exit — floating button */}
      {previewMode&&(
        <div style={{position:'fixed',top:12,right:16,zIndex:9999,display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-blue"
            style={{boxShadow:'0 4px 20px rgba(37,99,235,.5)',animation:'pulse 2s infinite'}}
            onClick={()=>setPreviewMode(false)}>
            ✏ Exit Preview
          </button>
          <button className="btn btn-dark btn-sm" onClick={copyShareLink} title="Copy shareable link">
            🔗 Share
          </button>
        </div>
      )}
      {shareToast&&(
        <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',
          background:'linear-gradient(135deg,#059669,#10b981)',color:'#fff',
          padding:'11px 20px',borderRadius:12,fontSize:13,fontWeight:600,
          boxShadow:'0 8px 24px rgba(0,0,0,.2)',zIndex:9999,whiteSpace:'nowrap',
          animation:'savedFlash 3s ease forwards'}}>
          ✓ {shareToast}
        </div>
      )}

      <div id="pdf-area">
        {/* ── PAGE 1: COVER ── */}
        <CoverPage deck={activeDeck} updateDeck={updateDeck} logoURI={window.SOSHMAN_LOGO_URI}/>
        {/* ── PAGE 2: BRAND CONTEXT + SELECTION CRITERIA (merged) ── */}
        <BrandContextPage deck={activeDeck} updateDeck={updateDeck}/>
        {/* ── PAGES 4-14: SHORTLIST (existing) ── */}
        {/* ── HERO — explicit page break before ── */}
        <div className="page-hero" style={{pageBreakBefore:'always',breakBefore:'page'}}>
          <div className="hero-left">
            <div className="hero-eyebrow">Creator Shortlist</div>
            <h1 className="hero-title">
              {activeDeck.brandLogo&&<img src={activeDeck.brandLogo} style={{height:36,maxWidth:120,objectFit:'contain',verticalAlign:'middle',marginRight:12}} alt="brand"/>}
              <span className="brand">{activeDeck.brandName||'[Brand Name]'}</span>
              <span className="x">×</span>
              <span className="sm">SoshMan</span>
            </h1>
            <p className="hero-sub">{activeDeck.campaignObjective}</p>
          </div>
          <div className="hero-right">
            <div className="prep-label">Prepared by</div>
            <Logo height={44} className="prep-logo"/>
          </div>
        </div>

        {/* ── CAMPAIGN DATES ── */}
        <div className="no-print" style={{padding:'0 32px 16px',display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:8,alignItems:'center',background:'#fff',border:'1px solid var(--border)',borderRadius:10,padding:'7px 14px'}}>
            <span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>CAMPAIGN DATES</span>
            <input style={{border:'none',outline:'none',fontFamily:'inherit',fontSize:12,color:'var(--ink)',background:'transparent',width:130}} value={activeDeck.campaignStart||''} onChange={e=>updateDeck(d=>({...d,campaignStart:e.target.value}))} placeholder="Start date"/>
            <span style={{color:'#ccc'}}>→</span>
            <input style={{border:'none',outline:'none',fontFamily:'inherit',fontSize:12,color:'var(--ink)',background:'transparent',width:130}} value={activeDeck.campaignEnd||''} onChange={e=>updateDeck(d=>({...d,campaignEnd:e.target.value}))} placeholder="End date"/>
          </div>
          <span style={{fontSize:11,color:'var(--muted)'}}>These dates sync to all creator cards</span>
        </div>

        {/* ── DECK STATS ── */}
        {activeDeck.creators.length>0&&(
          <div className="deck-stats">
            <div className="stat-pill">
              <span className="stat-val blue">{activeDeck.creators.length}</span>
              <span className="stat-label">
                {activeDeck.creators.length===1?'Creator':'Creators'}
                {activeDeck.brandName&&activeDeck.brandName!=='[Brand Name]'?' for '+activeDeck.brandName:''}
              </span>
            </div>
            <div className="stat-pill"><span className="stat-val">{fmtNum(totalFollowers)}</span><span className="stat-label">Total Reach</span></div>
            <div className="stat-pill"><span className="stat-val green">{avgEng}</span><span className="stat-label">Avg Engagement</span></div>
            <AvgFitPill avgFit={avgFit} avgPillars={avgPillars} brandName={activeDeck.brandName} creatorCount={activeDeck.creators.length}/>
          </div>
        )}

        {/* ── SEARCH / FILTER ── */}
        <div className="deck-toolbar no-print">
          <div className="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search creators…"/>
          </div>
          <div className="filter-chips">
            <span className={`chip${!filterTag?' active':''}`} onClick={()=>setFilterTag('')}>All</span>
            {allTags.map(t=><span key={t} className={`chip${filterTag===t?' active':''}`} onClick={()=>setFilterTag(t===filterTag?'':t)}>{t}</span>)}
          </div>
        </div>

        {/* ── SUMMARY TABLE ── */}
        <SummaryTable creators={filteredCreators}/>
        <div style={{padding:'0 32px 8px',fontSize:11,color:'#aaa'}}>{filteredCreators.length} creator{filteredCreators.length!==1?'s':''} shortlisted</div>

        {/* ── CREATOR CARDS ── */}
        <div className="cards-wrap">
          {filteredCreators.map(c=>(
            <CreatorCard key={c.id} creator={c}
              campaignStart={activeDeck.campaignStart}
              campaignEnd={activeDeck.campaignEnd}
              onEdit={setEditingId}
              onDelete={deleteCreator}
              onDuplicate={duplicateCreator}
              onGenerateWhy={generateWhy}
              onDragStart={handleDragStart}
              onDragOver={handleDragOver}
              onDrop={handleDrop}
              onDragEnd={handleDragEnd}/>
          ))}
        </div>

        {/* ── ADD CREATOR CTA ── */}
        {!previewMode&&(
          <div className="add-creator-cta no-print" onClick={addCreator}>
            <h4>+ Add Creator</h4>
            <p>Click to add another creator to this shortlist</p>
          </div>
        )}
        {/* ── PAGE 15: RECOMMENDATION & CONCLUSION ── */}
        <ConclusionPage deck={activeDeck} updateDeck={updateDeck}/>

      </div>

      {/* ── MODALS ── */}
      {editingCreator&&(
        <EditorModal
          creator={editingCreator}
          globalStart={activeDeck.campaignStart}
          globalEnd={activeDeck.campaignEnd}
          onSave={saveCreator}
          onClose={()=>setEditingId(null)}/>
      )}
      {/* ── SNAPSHOT HISTORY MODAL ── */}
      {showSnapshots&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowSnapshots(false);}}>
          <div className="modal" style={{maxWidth:420}}>
            <div className="modal-header">
              <h2>⏮ Version History</h2>
              <button className="btn btn-ghost btn-icon" onClick={()=>setShowSnapshots(false)}>✕</button>
            </div>
            <div className="modal-body">
              {snapshots.length===0&&<p style={{color:'#aaa',fontSize:13}}>No snapshots yet. Click 📸 Snapshot in the toolbar to save a restore point.</p>}
              {snapshots.map((snap,i)=>(
                <div key={snap.id} className="deck-item" style={{flexDirection:'column',alignItems:'flex-start',gap:6}}>
                  <div style={{display:'flex',justifyContent:'space-between',width:'100%',alignItems:'center'}}>
                    <div>
                      <div className="deck-item-name">Snapshot {snapshots.length-i}</div>
                      <div className="deck-item-sub">{snap.ts} · {snap.deck.creators?.length} creators</div>
                    </div>
                    <button className="btn btn-blue btn-sm" onClick={()=>restoreSnapshot(snap)}>Restore</button>
                  </div>
                </div>
              ))}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setSnapshots([])}>Clear All</button>
              <button className="btn btn-ghost" onClick={()=>setShowSnapshots(false)}>Close</button>
            </div>
          </div>
        </div>
      )}

      {showDecks&&(
        <DeckManagerModal
          decks={decks}
          activeDeckId={activeDeck.id}
          onSelect={id=>setActiveDeckId(id)}
          onNew={newDeck}
          onFromTemplate={newDeckFromTemplate}
          onRename={(id,name)=>setDecks(p=>p.map(d=>d.id===id?{...d,name}:d))}
          onDelete={(id)=>{setDecks(p=>p.filter(d=>d.id!==id));if(activeDeckId===id)setActiveDeckId(null);}}
          onClose={()=>setShowDecks(false)}/>
      )}
    </>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  const b=document.createElement('div');
  b.id='pwa-b';
  b.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:13px 18px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.35);display:flex;align-items:center;gap:12px;font-family:Plus Jakarta Sans,sans-serif;font-size:12px;max-width:360px;width:calc(100vw - 32px);animation:fadeSlideUp .3s ease;';
  const pwaBannerHtml='<img src="icons/icon-72x72.png" style="width:32px;height:32px;border-radius:7px;"><div style="flex:1"><div style="font-weight:700">Install SoshMan App</div><div style="opacity:.7;font-size:11px">Works offline</div></div><button id="pwa-install" style="background:#3b82f6;border:none;border-radius:8px;color:#fff;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Install</button><button id="pwa-close" style="background:rgba(255,255,255,.1);border:none;border-radius:7px;color:#fff;width:26px;height:26px;cursor:pointer;font-size:13px;">✕</button>';
  b.innerHTML=pwaBannerHtml;
  document.body.appendChild(b);
  document.getElementById('pwa-install').onclick=function(){deferredPrompt.prompt();b.remove();};
  document.getElementById('pwa-close').onclick=function(){b.remove();};
  document.body.appendChild(b);
});
</script>
